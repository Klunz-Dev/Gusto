version: 1.0.0
workflows:
  android-gusto-build:
    name: Gusto Android Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    
    environment:
      groups:
        - android-signing
      vars:
        ANDROID_NDK_VERSION: "25.2.9519653"
      java: 17
      # Интегрируем Flutter, так как Flet собирает APK через него
      flutter: stable 

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Установка и активация Python 3.13
        script: |
          pyenv install 3.13.0 --skip-existing
          pyenv global 3.13.0
          echo 'export PATH="$HOME/.pyenv/shims:$PATH"' >> $CM_ENV
          
      - name: Установка зависимостей Python и Flet CLI
        script: |
          python -m pip install --upgrade pip
          # setuptools необходим для корректной работы flet на Python 3.13+
          pip install setuptools flet requests
          
      - name: Настройка Android SDK окружения
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> local.properties

      - name: Сборка Android APK (Flet)
        script: |
          # Переходим в папку с исходным кодом, где лежит ваш main.py
          cd src
          
          # Запуск сборки Android приложения Gusto
          flet build apk --release --name Gusto

    artifacts:
      # Пути, куда Flet складывает готовые файлы после сборки
      - src/build/apk/release/*.apk
      - src/build/app/outputs/flutter-apk/*-release.apk

    publishing:
      email:
        recipients:
          - profardog@gmail.com
        notify:
          success: true
          failure: true
